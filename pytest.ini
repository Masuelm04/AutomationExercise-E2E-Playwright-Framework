[pytest]
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short

markers =
    smoke: Critical main user flow tests
    regression: Full regression test suite
    critical: High-priority test scenarios
    authentication: Authentication and user-related tests
    products: Product catalog and product tests
    cart: Shopping cart tests
    checkout: Checkout and payment tests
    e2e: End-to-End user flows
    api_ui: API and UI integration scenarios